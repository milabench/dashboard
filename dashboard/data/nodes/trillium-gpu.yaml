# Trillium GPU sub-cluster (Alliance Canada, SciNet / U of Toronto) https://docs.alliancecan.ca/wiki/Trillium
# Login node: trillium-gpu.alliancecan.ca   (different from the CPU sub-cluster)
# Compute nodes have NO internet access. No local disk ($SLURM_TMPDIR is a RAM disk).
# Jobs can only write to scratch, NOT to $HOME or $PROJECT.
# Allocation is by whole node or by whole GPU. MIG is not available.
# TODO: the wiki node table was garbled and the Trillium Quickstart was not provided:
#   - verify the node groups below
#   - the GRES names (h100 / h200 / b200) and partition names are guesses, check `sinfo -o "%P %G"`
#   - max job duration is unknown
#
# Each node type lists `chunks`: preconfigured slurm requests sized as a proportional
# share of the node (cpu / ram scale with the number of GPUs or cores requested).
#
# Partitions: compute (default, do not name it; 15 min - 24h, 1 GPU or whole nodes, 5 nodes max, 25 with an allocation)
#             debug   (1 running job, 1 GPU up to 2h, 4 GPUs 30 min, 8 GPUs (2 nodes) 15 min)
# Only 1 GPU or multiples of 4 can be requested, no MIG. Cores and memory are fixed by the request, full nodes still ask for all of them:
# 1 GPU = 24 cores + 188GiB, a whole node = 96 cores + 755GiB
account: null        # TODO: slurm account (def-<pi> / rrg-<pi>)
nodes:
- name: h100
  count: 63
  cpu: 96
  ram: 749
  cpu_model: 1 x AMD EPYC 9654 (Zen 4) @ 2.4 GHz
  gpu:
  - name: H100
    ram: 80
    count: 4
  chunks:
  - name: 1-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --gpus-per-node=1
    cpu: 24
    ram: 187
    gpu: 1
  - name: 4-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=96
    - --mem=0
    - --gpus-per-node=4
    cpu: 96
    ram: 749
    gpu: 4
  - name: debug-1-gpu
    slurm:
    - --partition=debug
    - --nodes=1
    - --ntasks=1
    - --gpus-per-node=1
    - --time=2:00:00
    cpu: 24
    ram: 188
    gpu: 1
  - name: debug-4-gpu
    slurm:
    - --partition=debug
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=96
    - --mem=0
    - --gpus-per-node=4
    - --time=0:30:00
    cpu: 96
    ram: 755
    gpu: 4
  - name: debug-8-gpu
    slurm:
    - --partition=debug
    - --nodes=2
    - --ntasks=2
    - --ntasks-per-node=1
    - --cpus-per-task=96
    - --mem=0
    - --gpus-per-node=4
    - --time=0:15:00
    cpu: 192
    ram: 1510
    gpu: 8
- name: h200
  count: 1
  cpu: 96
  ram: 1498
  cpu_model: 2 x AMD EPYC 9455 (Zen 5) @ 3.15 GHz
  gpu:
  - name: H200
    ram: 141
    count: 4
  chunks:
  - name: 1-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --gpus=h200:1
    cpu: 24
    ram: 374
    gpu: 1
  - name: 4-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=96
    - --mem=0
    - --gpus-per-node=h200:4
    cpu: 96
    ram: 1498
    gpu: 4
- name: b200
  count: 52
  cpu: 96
  ram: 2000
  cpu_model: 2 x Intel Xeon 8558P @ 2.7 GHz
  gpu:
  - name: B200
    ram: 180
    count: 8
  chunks:
  - name: 1-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --gpus=b200:1
    cpu: 12
    ram: 250
    gpu: 1
  - name: 4-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --gpus-per-node=b200:4
    cpu: 48
    ram: 1000
    gpu: 4
  - name: 8-gpu
    slurm:
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=96
    - --mem=0
    - --gpus-per-node=b200:8
    cpu: 96
    ram: 2000
    gpu: 8
max_time: 1-00:00:00
