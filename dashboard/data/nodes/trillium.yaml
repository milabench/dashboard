# Trillium CPU sub-cluster (Alliance Canada, SciNet / U of Toronto) https://docs.alliancecan.ca/wiki/Trillium
# Login node: trillium.alliancecan.ca   (the GPU sub-cluster has its own login node, see trillium-gpu.yaml)
# Compute nodes have NO internet access. No local disk ($SLURM_TMPDIR is a RAM disk).
# Jobs can only write to scratch, NOT to $HOME or $PROJECT.
# Allocation is by whole nodes of 192 cores.
# TODO: the Trillium Quickstart was not provided: partition names, max job duration and the scratch path are unknown.
#
# Each node type lists `chunks`: preconfigured slurm requests sized as a proportional
# share of the node (cpu / ram scale with the number of GPUs or cores requested).
#
# Partitions: compute (default, do not name it; 15 min - 24h, 1 to 10 nodes, 128 with an allocation)
#             debug   (1 running job, 1 to 2 nodes, up to 1h)
# Trillium ignores --mem and cannot allocate a number of cores, full nodes still ask for all of them: a job gets whole nodes (192 cores, 768GB)
account: null        # TODO: slurm account (def-<pi> / rrg-<pi>)
nodes:
- name: cpu
  count: 1224
  cpu: 192
  ram: 749
  cpu_model: 2 x AMD EPYC 9655 (Zen 5) @ 2.6 GHz
  chunks:
  - name: full-node
    slurm:
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=192
    - --mem=0
    cpu: 192
    ram: 749
  - name: debug-1-node
    slurm:
    - --partition=debug
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=192
    - --mem=0
    - --time=1:00:00
    cpu: 192
    ram: 755
  - name: debug-2-nodes
    slurm:
    - --partition=debug
    - --nodes=2
    - --ntasks=2
    - --ntasks-per-node=1
    - --cpus-per-task=192
    - --mem=0
    - --time=0:30:00
    cpu: 384
    ram: 1510
max_time: 1-00:00:00
