# Mila cluster
# Node types with their preconfigured slurm requests (chunks), ported from the profiles of
# milabench/config/clusters/slurm.yaml. A chunk keeps the exact sbatch arguments of its profile.
# The A6000 node type has no profile yet.
nodes:
- name: A100l
  gpu:
  - name: A100
    ram: 80
    count: 8
  notes: cn-d[003-004], partition milabench
  chunks:
  - name: multi-node-full
    slurm:
    - --partition=milabench
    - -w cn-d[003-004]
    - --ntasks=2
    - --gpus-per-task=a100l:8
    - --exclusive
    - --nodes=2
    - --cpus-per-task=128
    - --time=2:00:00
    - --ntasks-per-node=1
    - --mem=0
    - --export=ALL,MILABENCH_SIZER_AUTO=0
  - name: single-node-full-A100l
    slurm:
    - --job-name=1x8xA100_run
    - --partition=milabench
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=128
    - --mem=0
    - --time=4:00:00
    - --gpus-per-task=8
    - --ntasks-per-node=1
    - --export=ALL
    - -w cn-d[003-004]
  - name: multi-node-full-A100l
    slurm:
    - --job-name=2x8xA100_run
    - --partition=milabench
    - --nodes=2
    - --ntasks=2
    - --cpus-per-task=128
    - --mem=0
    - --time=6:00:00
    - --gpus-per-task=8
    - --ntasks-per-node=1
    - --export=ALL
    - -w cn-d[003-004]
  - name: single-A100
    slurm:
    - --job-name=1x1xA100_run
    - --partition=milabench
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=16
    - --mem=256G
    - --time=6:00:00
    - --gpus-per-task=1
    - --ntasks-per-node=1
    - --export=ALL
    - -w cn-d[003-004]
  - name: 1x2xA100
    slurm:
    - --job-name=1x2xA100_run
    - --partition=milabench
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=32
    - --mem=256G
    - --time=4:00:00
    - --gpus-per-task=2
    - --ntasks-per-node=1
    - --export=ALL
    - -w cn-d[003-004]
  - name: 1x8xA100l
    slurm:
    - --job-name=1x8xA100_run
    - --partition=milabench
    - --nodes=1
    - --ntasks=1
    - --cpus-per-task=128
    - --mem=0
    - --time=3:00:00
    - --gpus-per-task=8
    - --ntasks-per-node=1
    - --exclusive
    - --export=ALL
    - -w cn-d004
